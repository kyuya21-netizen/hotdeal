<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>핫딜천국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>/* Layout idea: blue sale-flyer header from the profile logo, sticky filter bar, compact rows by default with a card view. */
:root{
  --bg:#eef3ff; --card:#ffffff; --ink:#101a33; --sub:#55627f; --line:#d7e0f5; --soft:#f4f7ff;
  --red:#e5301f; --red-ink:#ffffff; --yellow:#ffd21f; --yellow-ink:#2a2100;
  --sel:#1b4fd8; --sel-ink:#ffffff; --bar1:#1b4fd8; --bar2:#0f2f9e; --warn:#9a4b00;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1226; --card:#131c38; --ink:#eaf0ff; --sub:#9aa9cf; --line:#25335c; --soft:#1a2547;
    --red:#ff6a4a; --red-ink:#1b0a05; --sel:#5a8bff; --sel-ink:#07122e; --bar1:#16389f; --bar2:#0a1b5c; --warn:#f0a35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1226; --card:#131c38; --ink:#eaf0ff; --sub:#9aa9cf; --line:#25335c; --soft:#1a2547;
  --red:#ff6a4a; --red-ink:#1b0a05; --sel:#5a8bff; --sel-ink:#07122e; --bar1:#16389f; --bar2:#0a1b5c; --warn:#f0a35e;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--sel) 55%,transparent);outline-offset:2px}

.bar{background:linear-gradient(135deg,var(--bar1),var(--bar2));color:#fff;padding:18px 16px 16px}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.avatar{width:60px;height:60px;border-radius:50%;border:3px solid var(--yellow);background:#fff;object-fit:cover;flex:0 0 auto}
.brand{min-width:0;flex:1 1 auto}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;color:var(--yellow);letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.tag{margin:2px 0 0;font-size:.82rem;color:#dbe6ff}
.upd{margin:0;font-size:.74rem;color:#c8d8ff;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}

.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.disc{margin:0;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:10px;font-size:.78rem;color:var(--sub)}

.sec-h{margin:0 0 8px;font-size:1rem;font-weight:700}
.pickrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.pickrow::-webkit-scrollbar{display:none}
.pickrow .deal{flex:0 0 168px;scroll-snap-align:start;border:2px solid var(--yellow)}

.filters{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px;padding:8px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#q{width:100%;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:.86rem;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink);font-weight:700}
.chip.q[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.ctl{display:flex;align-items:center;gap:8px}
.cnt{flex:1 1 auto;font-size:.84rem;color:var(--sub)}
#sort{font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--sub);font-size:.82rem;padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}

.list{display:grid;gap:10px}
.list.cards{grid-template-columns:1fr 1fr}
@media (min-width:700px){.list.cards{grid-template-columns:repeat(3,1fr)}}
.deal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:10px;position:relative}
.rows .deal{grid-template-columns:68px 1fr auto;align-items:center}
.cards .deal{grid-template-columns:1fr;align-content:start}
.deal.ended{opacity:.55}
.tile{border-radius:12px;background:var(--red);color:var(--red-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);line-height:1;overflow:hidden;position:relative}
.rows .tile{width:68px;height:68px}
.cards .tile{width:100%;aspect-ratio:1/1}
.tile b{font-weight:400;font-size:1.5rem}
.cards .tile b{font-size:2.4rem}
.tile small{font-size:.7rem;margin-top:3px;letter-spacing:.08em}
.tile.plain{background:var(--soft);color:var(--sub);font-family:var(--body);font-weight:700;font-size:.85rem;text-align:center;padding:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pc{position:absolute;left:6px;top:6px;background:var(--red);color:var(--red-ink);font-family:var(--display);font-size:.8rem;padding:2px 6px;border-radius:6px}
.rows .tile .pc{display:none}
.body{min-width:0}
.name{margin:0;font-size:.95rem;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;margin-top:3px;font-variant-numeric:tabular-nums}
.price strong{font-size:1.15rem;color:var(--red)}
.price s{font-size:.8rem;color:var(--sub)}
.price .pct{font-size:.8rem;font-weight:700;color:var(--red)}
.memo{margin:3px 0 0;font-size:.82rem;color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.rows .memo{-webkit-line-clamp:1}
.cards .memo{-webkit-line-clamp:2}
.meta{margin:3px 0 0;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}
.meta.stale{color:var(--warn);font-weight:700}
.act{display:flex;gap:6px;align-items:center}
.rows .act{flex-direction:column;align-items:stretch}
.go{flex:1 1 auto;display:block;text-align:center;text-decoration:none;font-weight:700;font-size:.88rem;background:var(--red);color:var(--red-ink);border-radius:10px;padding:9px 12px;white-space:nowrap}
.go.off{background:var(--soft);color:var(--sub)}
.fav{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:1rem;line-height:1;padding:8px 10px;cursor:pointer;color:var(--sub)}
.fav[aria-pressed="true"]{color:var(--red);border-color:var(--red)}
.tags{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.cards .tags{right:auto;left:auto;top:auto;position:static}
.badge{font-size:.68rem;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--yellow);color:var(--yellow-ink)}
.badge.gray{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.rows .badges{display:flex;gap:4px;margin-bottom:3px}
.cards .badges{display:flex;gap:4px}
.pickrow .deal{flex:0 0 176px}
.pickrow .tile{aspect-ratio:auto;height:92px}
.pickrow .tile b{font-size:1.8rem}
.pickrow .memo,.pickrow .meta{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.filebtn{display:inline-block;align-self:flex-start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:.9rem;cursor:pointer}
.vh:focus-visible + .filebtn{outline:3px solid color-mix(in srgb,var(--sel) 55%,transparent);outline-offset:2px}
.empty{margin:28px 0;text-align:center;color:var(--sub)}
.foot{margin:6px 0 0;color:var(--sub);font-size:.76rem;text-align:center}

.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.adm-in{border:0;border-radius:999px;background:var(--yellow);color:var(--yellow-ink);font-weight:700;font-size:.82rem;padding:7px 14px;cursor:pointer}
.fab{position:fixed;right:14px;bottom:14px;z-index:20;border:0;border-radius:999px;background:var(--yellow);color:var(--yellow-ink);font-weight:700;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,10,30,.6);display:flex;justify-content:center;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 16px 28px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0}
.sheet-head h2{margin:0;font-size:1.1rem}
.x{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer}
.card-f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label,.fgl{font-size:.82rem;font-weight:700}
.fg input[type=text],.fg input[type=search]{width:100%;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:20px;height:20px}
.hint{font-size:.74rem;color:var(--sub);margin:0}
.msg{margin:0;min-height:1.3em;font-size:.86rem;color:var(--sub)}
.msg.err{color:var(--warn);font-weight:700}
.btns{display:flex;gap:8px}
.primary{flex:1;border:0;border-radius:12px;background:var(--sel);color:var(--sel-ink);font-weight:700;padding:13px;cursor:pointer}
.primary:disabled{opacity:.55}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;cursor:pointer}
.sheet h3{margin:16px 0 8px;font-size:.95rem}
.ar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.ar b{font-size:.9rem;word-break:keep-all;overflow-wrap:anywhere}
.ar span{font-size:.78rem;color:var(--sub)}
.ab{display:flex;gap:6px;flex-wrap:wrap}
.ab button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.ab button.danger{color:var(--red);border-color:var(--red)}
#prev img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
@media (prefers-reduced-motion: no-preference){.deal{transition:transform .12s ease}.deal:active{transform:scale(.99)}}

/* shelves: horizontal rows per category with a expand-to-grid toggle */
.list.shelf{display:flex;flex-direction:column;gap:18px}
.shelf-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.shelf-h .sec-h{margin:0;display:flex;align-items:center;gap:6px}
.shelf-h .sec-h svg{color:var(--red);flex:0 0 auto}
.shelf-h .n{font-size:.82rem;font-weight:400;color:var(--sub)}
.more{border:0;background:transparent;color:var(--sub);font-size:.86rem;cursor:pointer;padding:6px 4px}
.shelfrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.shelfrow::-webkit-scrollbar{display:none}
.shelfrow .deal{flex:0 0 164px;scroll-snap-align:start}
.shelfrow .tile{aspect-ratio:auto;height:92px}
.shelfrow .tile b{font-size:1.8rem}
.shelfrow .memo,.shelfrow .meta{display:none}
.shelfrow.open{display:grid;grid-template-columns:1fr 1fr;overflow:visible;padding-bottom:2px}
@media (min-width:700px){.shelfrow.open{grid-template-columns:repeat(3,1fr)}}
.shelfrow.open .deal{flex:none}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <img id="logo" class="avatar" alt="핫딜천국 로고" width="60" height="60">
    <div class="brand">
      <h1>핫딜천국</h1>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="right">
      <p class="upd" id="upd"></p>
      <button type="button" id="adminBtn" class="adm-in" hidden>관리</button>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="disc" role="note">이 페이지의 일부 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>

  <section id="picks" hidden aria-label="오늘의 픽">
    <h2 class="sec-h">오늘의 픽</h2>
    <div id="pickrow" class="pickrow cards"></div>
  </section>

  <div class="filters">
    <input id="q" type="search" placeholder="상품 이름으로 찾기" autocomplete="off" aria-label="상품 검색">
    <div class="chips" id="cats" role="group" aria-label="카테고리"></div>
    <div class="chips" id="quick" role="group" aria-label="빠른 필터"></div>
    <div class="ctl">
      <span class="cnt" id="cnt"></span>
      <select id="sort" aria-label="정렬">
        <option value="new">최신순</option>
        <option value="pct">할인율순</option>
        <option value="low">낮은 가격순</option>
      </select>
      <div class="seg" id="view" role="group" aria-label="보기 방식">
        <button type="button" data-v="shelf" aria-pressed="true">선반</button>
        <button type="button" data-v="rows" aria-pressed="false">목록</button>
        <button type="button" data-v="cards" aria-pressed="false">카드</button>
      </div>
    </div>
  </div>

  <section id="list" class="list shelf" aria-label="딜 목록"></section>
  <p class="empty" id="empty" hidden>맞는 딜이 없어요. 필터를 바꿔 보세요.</p>
  <p class="foot">가격과 재고는 수시로 바뀌어요. 구매 전에 판매 페이지에서 꼭 확인하세요.</p>
</main>

<div id="admin" class="sheet" hidden role="dialog" aria-modal="true" aria-label="딜 관리">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="admTitle">딜 추가</h2>
      <button type="button" id="admClose" class="x">닫기</button>
    </div>
    <form id="f" class="card-f" autocomplete="off">
      <div class="fg"><label for="f-name">제품명</label><input id="f-name" type="text" placeholder="예) OO 핫팩 100개입"></div>
      <div class="two">
        <div class="fg"><label for="f-price">현재가(원)</label><input id="f-price" type="text" inputmode="numeric" placeholder="12900"></div>
        <div class="fg"><label for="f-regular">평소가(원, 선택)</label><input id="f-regular" type="text" inputmode="numeric" placeholder="19800"></div>
      </div>
      <div class="fg"><label for="f-link">링크</label><input id="f-link" type="text" placeholder="https://link.coupang.com/..."></div>
      <label class="chk"><input id="f-partner" type="checkbox"> 쿠팡 파트너스 링크 (수수료 표시)</label>
      <div class="fg"><label for="f-cat">카테고리</label><input id="f-cat" type="text" list="catlist" placeholder="생활, 가전, 식품…"><datalist id="catlist"></datalist></div>
      <div class="fg"><label for="f-memo">한 줄 메모 (선택)</label><input id="f-memo" type="text" maxlength="80" placeholder="확인한 내용만 적어 주세요"></div>
      <div class="fg">
        <span class="fgl">사진 (선택)</span>
        <input id="f-img" class="vh" type="file" accept="image/*">
        <label class="filebtn" for="f-img">사진 고르기</label>
        <div id="prev"></div>
        <p class="hint">직접 찍었거나 사용 허가를 받은 사진만 올려 주세요. 없으면 할인율이 표시돼요.</p>
      </div>
      <label class="chk"><input id="f-pick" type="checkbox"> 오늘의 픽으로 올리기</label>
      <label class="chk" id="endWrap" hidden><input id="f-ended" type="checkbox"> 종료된 딜 (품절, 가격 상승)</label>
      <p id="admMsg" class="msg" role="status"></p>
      <div class="btns">
        <button type="submit" id="saveBtn" class="primary">저장하고 올리기</button>
        <button type="button" id="cancelEdit" class="ghost" hidden>수정 취소</button>
      </div>
      <p class="hint">저장하면 페이지가 새로고침되며 모든 방문자에게 바로 반영돼요.</p>
    </form>
    <h3>등록된 딜</h3>
    <div id="admList"></div>
    <button type="button" id="clearSample" class="ghost" hidden>예시 딜 모두 지우기</button>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>/* Layout idea: blue sale-flyer header from the profile logo, sticky filter bar, compact rows by default with a card view. */
:root{
  --bg:#eef3ff; --card:#ffffff; --ink:#101a33; --sub:#55627f; --line:#d7e0f5; --soft:#f4f7ff;
  --red:#e5301f; --red-ink:#ffffff; --yellow:#ffd21f; --yellow-ink:#2a2100;
  --sel:#1b4fd8; --sel-ink:#ffffff; --bar1:#1b4fd8; --bar2:#0f2f9e; --warn:#9a4b00;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1226; --card:#131c38; --ink:#eaf0ff; --sub:#9aa9cf; --line:#25335c; --soft:#1a2547;
    --red:#ff6a4a; --red-ink:#1b0a05; --sel:#5a8bff; --sel-ink:#07122e; --bar1:#16389f; --bar2:#0a1b5c; --warn:#f0a35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1226; --card:#131c38; --ink:#eaf0ff; --sub:#9aa9cf; --line:#25335c; --soft:#1a2547;
  --red:#ff6a4a; --red-ink:#1b0a05; --sel:#5a8bff; --sel-ink:#07122e; --bar1:#16389f; --bar2:#0a1b5c; --warn:#f0a35e;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--sel) 55%,transparent);outline-offset:2px}

.bar{background:linear-gradient(135deg,var(--bar1),var(--bar2));color:#fff;padding:18px 16px 16px}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.avatar{width:60px;height:60px;border-radius:50%;border:3px solid var(--yellow);background:#fff;object-fit:cover;flex:0 0 auto}
.brand{min-width:0;flex:1 1 auto}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05;color:var(--yellow);letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.tag{margin:2px 0 0;font-size:.82rem;color:#dbe6ff}
.upd{margin:0;font-size:.74rem;color:#c8d8ff;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}

.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.disc{margin:0;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:10px;font-size:.78rem;color:var(--sub)}

.sec-h{margin:0 0 8px;font-size:1rem;font-weight:700}
.pickrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.pickrow::-webkit-scrollbar{display:none}
.pickrow .deal{flex:0 0 168px;scroll-snap-align:start;border:2px solid var(--yellow)}

.filters{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px;padding:8px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#q{width:100%;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:.86rem;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink);font-weight:700}
.chip.q[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.ctl{display:flex;align-items:center;gap:8px}
.cnt{flex:1 1 auto;font-size:.84rem;color:var(--sub)}
#sort{font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--sub);font-size:.82rem;padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}

.list{display:grid;gap:10px}
.list.cards{grid-template-columns:1fr 1fr}
@media (min-width:700px){.list.cards{grid-template-columns:repeat(3,1fr)}}
.deal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:10px;position:relative}
.rows .deal{grid-template-columns:68px 1fr auto;align-items:center}
.cards .deal{grid-template-columns:1fr;align-content:start}
.deal.ended{opacity:.55}
.tile{border-radius:12px;background:var(--red);color:var(--red-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);line-height:1;overflow:hidden;position:relative}
.rows .tile{width:68px;height:68px}
.cards .tile{width:100%;aspect-ratio:1/1}
.tile b{font-weight:400;font-size:1.5rem}
.cards .tile b{font-size:2.4rem}
.tile small{font-size:.7rem;margin-top:3px;letter-spacing:.08em}
.tile.plain{background:var(--soft);color:var(--sub);font-family:var(--body);font-weight:700;font-size:.85rem;text-align:center;padding:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pc{position:absolute;left:6px;top:6px;background:var(--red);color:var(--red-ink);font-family:var(--display);font-size:.8rem;padding:2px 6px;border-radius:6px}
.rows .tile .pc{display:none}
.body{min-width:0}
.name{margin:0;font-size:.95rem;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;margin-top:3px;font-variant-numeric:tabular-nums}
.price strong{font-size:1.15rem;color:var(--red)}
.price s{font-size:.8rem;color:var(--sub)}
.price .pct{font-size:.8rem;font-weight:700;color:var(--red)}
.memo{margin:3px 0 0;font-size:.82rem;color:var(--ink);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.rows .memo{-webkit-line-clamp:1}
.cards .memo{-webkit-line-clamp:2}
.meta{margin:3px 0 0;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}
.meta.stale{color:var(--warn);font-weight:700}
.act{display:flex;gap:6px;align-items:center}
.rows .act{flex-direction:column;align-items:stretch}
.go{flex:1 1 auto;display:block;text-align:center;text-decoration:none;font-weight:700;font-size:.88rem;background:var(--red);color:var(--red-ink);border-radius:10px;padding:9px 12px;white-space:nowrap}
.go.off{background:var(--soft);color:var(--sub)}
.fav{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:1rem;line-height:1;padding:8px 10px;cursor:pointer;color:var(--sub)}
.fav[aria-pressed="true"]{color:var(--red);border-color:var(--red)}
.tags{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.cards .tags{right:auto;left:auto;top:auto;position:static}
.badge{font-size:.68rem;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--yellow);color:var(--yellow-ink)}
.badge.gray{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.rows .badges{display:flex;gap:4px;margin-bottom:3px}
.cards .badges{display:flex;gap:4px}
.pickrow .deal{flex:0 0 176px}
.pickrow .tile{aspect-ratio:auto;height:92px}
.pickrow .tile b{font-size:1.8rem}
.pickrow .memo,.pickrow .meta{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.filebtn{display:inline-block;align-self:flex-start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:.9rem;cursor:pointer}
.vh:focus-visible + .filebtn{outline:3px solid color-mix(in srgb,var(--sel) 55%,transparent);outline-offset:2px}
.empty{margin:28px 0;text-align:center;color:var(--sub)}
.foot{margin:6px 0 0;color:var(--sub);font-size:.76rem;text-align:center}

.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.adm-in{border:0;border-radius:999px;background:var(--yellow);color:var(--yellow-ink);font-weight:700;font-size:.82rem;padding:7px 14px;cursor:pointer}
.fab{position:fixed;right:14px;bottom:14px;z-index:20;border:0;border-radius:999px;background:var(--yellow);color:var(--yellow-ink);font-weight:700;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,10,30,.6);display:flex;justify-content:center;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 16px 28px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:-14px;background:var(--bg);padding:6px 0}
.sheet-head h2{margin:0;font-size:1.1rem}
.x{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer}
.card-f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label,.fgl{font-size:.82rem;font-weight:700}
.fg input[type=text],.fg input[type=search]{width:100%;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:20px;height:20px}
.hint{font-size:.74rem;color:var(--sub);margin:0}
.msg{margin:0;min-height:1.3em;font-size:.86rem;color:var(--sub)}
.msg.err{color:var(--warn);font-weight:700}
.btns{display:flex;gap:8px}
.primary{flex:1;border:0;border-radius:12px;background:var(--sel);color:var(--sel-ink);font-weight:700;padding:13px;cursor:pointer}
.primary:disabled{opacity:.55}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;cursor:pointer}
.sheet h3{margin:16px 0 8px;font-size:.95rem}
.ar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.ar b{font-size:.9rem;word-break:keep-all;overflow-wrap:anywhere}
.ar span{font-size:.78rem;color:var(--sub)}
.ab{display:flex;gap:6px;flex-wrap:wrap}
.ab button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer}
.ab button.danger{color:var(--red);border-color:var(--red)}
#prev img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
@media (prefers-reduced-motion: no-preference){.deal{transition:transform .12s ease}.deal:active{transform:scale(.99)}}

/* shelves: horizontal rows per category with a expand-to-grid toggle */
.list.shelf{display:flex;flex-direction:column;gap:18px}
.shelf-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.shelf-h .sec-h{margin:0;display:flex;align-items:center;gap:6px}
.shelf-h .sec-h svg{color:var(--red);flex:0 0 auto}
.shelf-h .n{font-size:.82rem;font-weight:400;color:var(--sub)}
.more{border:0;background:transparent;color:var(--sub);font-size:.86rem;cursor:pointer;padding:6px 4px}
.shelfrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.shelfrow::-webkit-scrollbar{display:none}
.shelfrow .deal{flex:0 0 164px;scroll-snap-align:start}
.shelfrow .tile{aspect-ratio:auto;height:92px}
.shelfrow .tile b{font-size:1.8rem}
.shelfrow .memo,.shelfrow .meta{display:none}
.shelfrow.open{display:grid;grid-template-columns:1fr 1fr;overflow:visible;padding-bottom:2px}
@media (min-width:700px){.shelfrow.open{grid-template-columns:repeat(3,1fr)}}
.shelfrow.open .deal{flex:none}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <img id="logo" class="avatar" alt="핫딜천국 로고" width="60" height="60">
    <div class="brand">
      <h1>핫딜천국</h1>
      <p class="tag" id="tagline"></p>
    </div>
    <div class="right">
      <p class="upd" id="upd"></p>
      <button type="button" id="adminBtn" class="adm-in" hidden>관리</button>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="disc" role="note">이 페이지의 일부 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>

  <section id="picks" hidden aria-label="오늘의 픽">
    <h2 class="sec-h">오늘의 픽</h2>
    <div id="pickrow" class="pickrow cards"></div>
  </section>

  <div class="filters">
    <input id="q" type="search" placeholder="상품 이름으로 찾기" autocomplete="off" aria-label="상품 검색">
    <div class="chips" id="cats" role="group" aria-label="카테고리"></div>
    <div class="chips" id="quick" role="group" aria-label="빠른 필터"></div>
    <div class="ctl">
      <span class="cnt" id="cnt"></span>
      <select id="sort" aria-label="정렬">
        <option value="new">최신순</option>
        <option value="pct">할인율순</option>
        <option value="low">낮은 가격순</option>
      </select>
      <div class="seg" id="view" role="group" aria-label="보기 방식">
        <button type="button" data-v="shelf" aria-pressed="true">선반</button>
        <button type="button" data-v="rows" aria-pressed="false">목록</button>
        <button type="button" data-v="cards" aria-pressed="false">카드</button>
      </div>
    </div>
  </div>

  <section id="list" class="list shelf" aria-label="딜 목록"></section>
  <p class="empty" id="empty" hidden>맞는 딜이 없어요. 필터를 바꿔 보세요.</p>
  <p class="foot">가격과 재고는 수시로 바뀌어요. 구매 전에 판매 페이지에서 꼭 확인하세요.</p>
</main>

<div id="admin" class="sheet" hidden role="dialog" aria-modal="true" aria-label="딜 관리">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="admTitle">딜 추가</h2>
      <button type="button" id="admClose" class="x">닫기</button>
    </div>
    <form id="f" class="card-f" autocomplete="off">
      <div class="fg"><label for="f-name">제품명</label><input id="f-name" type="text" placeholder="예) OO 핫팩 100개입"></div>
      <div class="two">
        <div class="fg"><label for="f-price">현재가(원)</label><input id="f-price" type="text" inputmode="numeric" placeholder="12900"></div>
        <div class="fg"><label for="f-regular">평소가(원, 선택)</label><input id="f-regular" type="text" inputmode="numeric" placeholder="19800"></div>
      </div>
      <div class="fg"><label for="f-link">링크</label><input id="f-link" type="text" placeholder="https://link.coupang.com/..."></div>
      <label class="chk"><input id="f-partner" type="checkbox"> 쿠팡 파트너스 링크 (수수료 표시)</label>
      <div class="fg"><label for="f-cat">카테고리</label><input id="f-cat" type="text" list="catlist" placeholder="생활, 가전, 식품…"><datalist id="catlist"></datalist></div>
      <div class="fg"><label for="f-memo">한 줄 메모 (선택)</label><input id="f-memo" type="text" maxlength="80" placeholder="확인한 내용만 적어 주세요"></div>
      <div class="fg">
        <span class="fgl">사진 (선택)</span>
        <input id="f-img" class="vh" type="file" accept="image/*">
        <label class="filebtn" for="f-img">사진 고르기</label>
        <div id="prev"></div>
        <p class="hint">직접 찍었거나 사용 허가를 받은 사진만 올려 주세요. 없으면 할인율이 표시돼요.</p>
      </div>
      <label class="chk"><input id="f-pick" type="checkbox"> 오늘의 픽으로 올리기</label>
      <label class="chk" id="endWrap" hidden><input id="f-ended" type="checkbox"> 종료된 딜 (품절, 가격 상승)</label>
      <p id="admMsg" class="msg" role="status"></p>
      <div class="btns">
        <button type="submit" id="saveBtn" class="primary">저장하고 올리기</button>
        <button type="button" id="cancelEdit" class="ghost" hidden>수정 취소</button>
      </div>
      <p class="hint">저장하면 페이지가 새로고침되며 모든 방문자에게 바로 반영돼요.</p>
    </form>
    <h3>등록된 딜</h3>
    <div id="admList"></div>
    <button type="button" id="clearSample" class="ghost" hidden>예시 딜 모두 지우기</button>
  </div>
</div>

<script>(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };

  /* ---- self-republish helpers (the page rebuilds its own document) ---- */
  var CLOSE = '<' + '/script', BS = String.fromCharCode(92), ESCD = '<' + BS + '/script';
  var MARK_DATA = '<' + '!--@@' + 'DATA@@-->', MARK_TPL = '<' + '!--@@' + 'TPL@@-->';
  function escTpl(s){ return s.split(CLOSE).join(ESCD); }
  function unescTpl(s){ return s.split(ESCD).join(CLOSE); }
  var T = '';
  function getT(){
    if(!T){ try{ var e = $('#tpl'); if(e) T = unescTpl(e.textContent); }catch(err){} }
    return T;
  }
  function dataBlock(d){
    return '<' + 'script type="application/json" id="deal-data">' + JSON.stringify(d).replace(/</g, '\\u003c') + '<' + '/script>';
  }
  function tplBlock(){ return '<' + 'script type="text/plain" id="tpl">' + escTpl(getT()) + '<' + '/script>'; }
  function buildDoc(d){
    var tt = getT();
    var i1 = tt.indexOf(MARK_DATA), i2 = tt.indexOf(MARK_TPL);
    if(i1 < 0 || i2 < i1) throw new Error('tpl');
    return tt.slice(0, i1) + dataBlock(d) + tt.slice(i1 + MARK_DATA.length, i2) + tplBlock() + tt.slice(i2 + MARK_TPL.length);
  }

  /* ---- data ---- */
  var data = {deals: [], tagline: '', logo: ''};
  try{ data = JSON.parse($('#deal-data').textContent); }catch(e){}
  var deals = (data.deals || []).map(function(d, i){
    var pct = (d.price > 0 && d.regular > d.price) ? Math.round((1 - d.price / d.regular) * 100) : 0;
    return Object.assign({}, d, {pct: pct, t: new Date(d.checked).getTime() || 0, i: i});
  });

  if(data.logo) $('#logo').src = 'data:image/webp;base64,' + data.logo;
  $('#tagline').textContent = data.tagline || '';

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function won(n){ return Number(n).toLocaleString('ko-KR') + '원'; }
  function two(n){ return (n < 10 ? '0' : '') + n; }
  function kst(ms){
    var t = new Date(ms + 9 * 3600 * 1000);
    return (t.getUTCMonth() + 1) + '/' + t.getUTCDate() + ' ' + two(t.getUTCHours()) + ':' + two(t.getUTCMinutes());
  }
  function okUrl(u){ return /^https?:\/\//i.test(u || ''); }
  function num(s){ var d = String(s || '').replace(/[^\d]/g, ''); return d ? parseInt(d, 10) : 0; }

  var last = deals.reduce(function(m, d){ return Math.max(m, d.t); }, 0);
  $('#upd').textContent = last ? '갱신 ' + kst(last) : '';

  /* ---- viewer state ---- */
  var favs = [];
  try{ favs = JSON.parse(localStorage.getItem('hd-fav') || '[]'); }catch(e){ favs = []; }
  function saveFavs(){ try{ localStorage.setItem('hd-fav', JSON.stringify(favs)); }catch(e){} }
  var state = {q: '', cat: '전체', sort: 'new', view: 'shelf', quick: {}, open: {}};
  try{ var sv = localStorage.getItem('hd-view'); if(sv === 'cards' || sv === 'rows' || sv === 'shelf') state.view = sv; }catch(e){}

  var QUICK = [
    {k: 'pct', label: '30%↑', test: function(d){ return d.pct >= 30; }},
    {k: 'low', label: '1만원 이하', test: function(d){ return d.price > 0 && d.price <= 10000; }},
    {k: 'new', label: '오늘 올라온', test: function(d){ return d.t && Date.now() - d.t <= 86400000; }},
    {k: 'fav', label: '♥ 찜', test: function(d){ return favs.indexOf(d.id) >= 0; }}
  ];

  function buildChips(){
    var cats = ['전체'], counts = {'전체': deals.length};
    deals.forEach(function(d){
      var c = d.category || '기타';
      if(cats.indexOf(c) < 0) cats.push(c);
      counts[c] = (counts[c] || 0) + 1;
    });
    if(cats.indexOf(state.cat) < 0) state.cat = '전체';
    var cb = $('#cats'); cb.innerHTML = '';
    cats.forEach(function(c){
      var b = el('button', 'chip', c + ' ' + counts[c]); b.type = 'button';
      b.setAttribute('aria-pressed', c === state.cat ? 'true' : 'false');
      b.addEventListener('click', function(){ state.cat = c; buildChips(); render(); });
      cb.appendChild(b);
    });
    var qb = $('#quick'); qb.innerHTML = '';
    QUICK.forEach(function(q){
      var label = q.k === 'fav' ? q.label + (favs.length ? ' ' + favs.length : '') : q.label;
      var b = el('button', 'chip q', label); b.type = 'button';
      b.setAttribute('aria-pressed', state.quick[q.k] ? 'true' : 'false');
      b.addEventListener('click', function(){ state.quick[q.k] = !state.quick[q.k]; buildChips(); render(); });
      qb.appendChild(b);
    });
  }

  $('#q').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); render(); });
  $('#sort').addEventListener('change', function(e){ state.sort = e.target.value; render(); });
  $('#view').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.view = b.getAttribute('data-v');
    try{ localStorage.setItem('hd-view', state.view); }catch(err){}
    syncView(); render();
  });
  function syncView(){
    $('#view').querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-v') === state.view ? 'true' : 'false'); });
    $('#list').className = 'list ' + state.view;
  }

  function card(d){
    var c = el('article', 'deal' + (d.ended ? ' ended' : ''));
    var tile;
    if(d.img && /^data:image\//.test(d.img)){
      tile = el('div', 'tile'); var im = document.createElement('img'); im.src = d.img; im.alt = ''; tile.appendChild(im);
      if(d.pct) tile.appendChild(el('span', 'pc', d.pct + '%'));
    } else if(d.pct){
      tile = el('div', 'tile'); tile.appendChild(el('b', '', d.pct + '%')); tile.appendChild(el('small', '', 'OFF'));
    } else {
      tile = el('div', 'tile plain', d.category || '딜');
    }
    c.appendChild(tile);

    var body = el('div', 'body');
    var badges = el('div', 'badges');
    if(d.ended) badges.appendChild(el('span', 'badge gray', '종료'));
    if(d.pick) badges.appendChild(el('span', 'badge', '오늘의 픽'));
    if(d.sample) badges.appendChild(el('span', 'badge gray', '예시'));
    if(badges.childNodes.length) body.appendChild(badges);
    body.appendChild(el('h3', 'name', d.name));
    var price = el('div', 'price');
    price.appendChild(el('strong', '', won(d.price)));
    if(d.regular > d.price){ price.appendChild(el('s', '', won(d.regular))); price.appendChild(el('span', 'pct', d.pct + '%')); }
    body.appendChild(price);
    if(d.memo) body.appendChild(el('p', 'memo', d.memo));
    var stale = d.t && (Date.now() - d.t > 86400000) && !d.ended;
    var metaText = d.t ? (kst(d.t) + ' 확인' + (d.partner ? ' · 쿠팡 파트너스' : '') + (stale ? ' · 가격 변동 가능' : '')) : '';
    if(metaText) body.appendChild(el('p', 'meta' + (stale ? ' stale' : ''), metaText));
    c.appendChild(body);

    var act = el('div', 'act');
    if(okUrl(d.link) && !d.sample && !d.ended){
      var a = el('a', 'go', '보러 가기');
      a.href = d.link; a.target = '_blank'; a.rel = 'noopener noreferrer sponsored nofollow';
      act.appendChild(a);
    } else {
      act.appendChild(el('span', 'go off', d.ended ? '종료' : '준비 중'));
    }
    var fv = el('button', 'fav', favs.indexOf(d.id) >= 0 ? '♥' : '♡'); fv.type = 'button';
    fv.setAttribute('aria-label', '찜'); fv.setAttribute('aria-pressed', favs.indexOf(d.id) >= 0 ? 'true' : 'false');
    fv.addEventListener('click', function(){
      var ix = favs.indexOf(d.id);
      if(ix >= 0) favs.splice(ix, 1); else favs.push(d.id);
      saveFavs(); buildChips(); render();
    });
    act.appendChild(fv);
    c.appendChild(act);
    return c;
  }

  var FLAME = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2c1 3.5-1 5-2.5 7C8 11 7 12.5 7 14.5a5 5 0 0 0 10 0c0-2-1-3.5-2-4.5.3 2-1 3-2 2.5C13.5 9 13.5 5 12 2z"/></svg>';
  function shelf(title, items, hot){
    var sec = el('section', 'shelf');
    var head = el('div', 'shelf-h');
    var h = el('h2', 'sec-h');
    if(hot) h.insertAdjacentHTML('afterbegin', FLAME);
    h.appendChild(document.createTextNode(title));
    h.appendChild(el('span', 'n', String(items.length)));
    head.appendChild(h);
    var row = el('div', 'shelfrow cards' + (state.open[title] ? ' open' : ''));
    items.forEach(function(d){ row.appendChild(card(d)); });
    if(items.length > 2){
      var b = el('button', 'more', state.open[title] ? '접기' : '펼쳐보기'); b.type = 'button';
      b.setAttribute('aria-expanded', state.open[title] ? 'true' : 'false');
      b.addEventListener('click', function(){
        state.open[title] = !state.open[title];
        row.classList.toggle('open', !!state.open[title]);
        b.textContent = state.open[title] ? '접기' : '펼쳐보기';
        b.setAttribute('aria-expanded', state.open[title] ? 'true' : 'false');
      });
      head.appendChild(b);
    }
    sec.appendChild(head); sec.appendChild(row);
    return sec;
  }
  function renderShelves(rows, list){
    var live = rows.filter(function(d){ return !d.ended; });
    var hot = live.filter(function(d){ return d.pct > 0; }).sort(function(a, b){ return b.pct - a.pct; }).slice(0, 10);
    if(hot.length) list.appendChild(shelf('지금 핫딜', hot, true));
    var order = [], groups = {};
    rows.forEach(function(d){
      var c = d.category || '기타';
      if(!groups[c]){ groups[c] = []; order.push(c); }
      groups[c].push(d);
    });
    order.forEach(function(c){ list.appendChild(shelf(c, groups[c], false)); });
  }

  function render(){
    var rows = deals.filter(function(d){
      if(state.cat !== '전체' && (d.category || '기타') !== state.cat) return false;
      if(state.q && (d.name + ' ' + (d.memo || '')).toLowerCase().indexOf(state.q) < 0) return false;
      for(var i = 0; i < QUICK.length; i++){ if(state.quick[QUICK[i].k] && !QUICK[i].test(d)) return false; }
      return true;
    });
    rows.sort(function(a, b){
      if(!!a.ended !== !!b.ended) return a.ended ? 1 : -1;
      if(state.sort === 'pct' && b.pct !== a.pct) return b.pct - a.pct;
      if(state.sort === 'low' && a.price !== b.price) return a.price - b.price;
      return (b.t - a.t) || (a.i - b.i);
    });
    var list = $('#list'); list.innerHTML = '';
    if(state.view === 'shelf') renderShelves(rows, list);
    else rows.forEach(function(d){ list.appendChild(card(d)); });
    $('#cnt').textContent = '딜 ' + rows.length + '개';
    $('#empty').hidden = rows.length > 0;

    var picks = deals.filter(function(d){ return d.pick && !d.ended; });
    var pr = $('#pickrow'); pr.innerHTML = '';
    picks.forEach(function(d){ pr.appendChild(card(d)); });
    $('#picks').hidden = picks.length === 0;
  }

  /* ---- admin (owner or editor only) ---- */
  var adminReady = false, busy = false, editingId = null, imgState = {mode: 'keep', url: ''};
  function msg(text, isErr){ var m = $('#admMsg'); m.textContent = text || ''; m.className = 'msg' + (isErr ? ' err' : ''); }
  function setBusy(b){ busy = b; $('#saveBtn').disabled = b; }

  function fileToDataUrl(file, maxSide){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){
        var s = Math.min(1, maxSide / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('img')); };
      im.src = url;
    });
  }
  function showPrev(url){
    var p = $('#prev'); p.innerHTML = '';
    if(!url) return;
    var im = document.createElement('img'); im.src = url; im.alt = '';
    p.appendChild(im);
    var b = el('button', 'ghost', '사진 지우기'); b.type = 'button'; b.style.marginTop = '6px';
    b.addEventListener('click', function(){ imgState = {mode: 'clear', url: ''}; $('#f-img').value = ''; showPrev(''); });
    p.appendChild(b);
  }
  $('#f-img').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    fileToDataUrl(f, 360).then(function(u){ imgState = {mode: 'new', url: u}; showPrev(u); })
      .catch(function(){ msg('사진을 읽지 못했어요. 다른 사진을 골라 주세요.', true); });
  });
  $('#f-link').addEventListener('input', function(){
    if(/coupang\.com|coupa\.ng/i.test(this.value)) $('#f-partner').checked = true;
  });

  function resetForm(){
    editingId = null; imgState = {mode: 'keep', url: ''};
    ['#f-name', '#f-price', '#f-regular', '#f-link', '#f-cat', '#f-memo'].forEach(function(s){ $(s).value = ''; });
    $('#f-img').value = ''; showPrev('');
    $('#f-partner').checked = true; $('#f-pick').checked = false; $('#f-ended').checked = false;
    $('#endWrap').hidden = true; $('#cancelEdit').hidden = true;
    $('#admTitle').textContent = '딜 추가'; $('#saveBtn').textContent = '저장하고 올리기';
    msg('');
  }
  function startEdit(d){
    editingId = d.id; imgState = {mode: 'keep', url: ''};
    $('#f-name').value = d.name || ''; $('#f-price').value = d.price || ''; $('#f-regular').value = d.regular || '';
    $('#f-link').value = d.link || ''; $('#f-cat').value = d.category || ''; $('#f-memo').value = d.memo || '';
    $('#f-partner').checked = !!d.partner; $('#f-pick').checked = !!d.pick; $('#f-ended').checked = !!d.ended;
    $('#f-img').value = ''; showPrev(d.img || '');
    $('#endWrap').hidden = false; $('#cancelEdit').hidden = false;
    $('#admTitle').textContent = '딜 수정'; $('#saveBtn').textContent = '수정 저장하고 올리기';
    msg(''); $('.sheet-in').scrollTop = 0;
  }
  $('#cancelEdit').addEventListener('click', resetForm);

  function plain(d){
    return {id: d.id, name: d.name, price: d.price, regular: d.regular || 0, category: d.category || '',
      link: d.link || '', partner: !!d.partner, memo: d.memo || '', img: d.img || '', pick: !!d.pick,
      ended: !!d.ended, sample: !!d.sample, checked: d.checked};
  }

  async function commit(nextDeals){
    if(busy) return;
    setBusy(true); msg('올리는 중이에요…');
    var artifact = null;
    try{ artifact = await claude.use('artifact'); }catch(e){ artifact = null; }
    if(!artifact){ msg('이 화면에서는 저장할 수 없어요. Claude 앱에서 열어 주세요.', true); setBusy(false); return; }
    var next = {updated: new Date().toISOString(), logo: data.logo || '', tagline: data.tagline || '', deals: nextDeals};
    try{ sessionStorage.setItem('hd-admin', '1'); }catch(e){}
    try{
      await artifact.publish(buildDoc(next));
      msg('올렸어요. 잠시 뒤 새로고침돼요.');
      setTimeout(function(){ setBusy(false); }, 8000);
    }catch(err){
      var c = err && err.code;
      if(c === 'conflict') msg('그 사이에 다른 곳에서 바뀌었어요. 새로고침한 뒤 다시 해 주세요.', true);
      else if(c === 'not_granted' || c === 'not_writer') msg('이 페이지를 수정할 권한이 없어요.', true);
      else msg('저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.', true);
      setBusy(false);
    }
  }

  $('#f').addEventListener('submit', function(e){
    e.preventDefault();
    if(busy) return;
    var name = $('#f-name').value.trim(), price = num($('#f-price').value), regular = num($('#f-regular').value);
    var link = $('#f-link').value.trim();
    if(!name){ msg('제품명을 적어 주세요.', true); return; }
    if(!price){ msg('현재가를 숫자로 적어 주세요.', true); return; }
    if(link && !okUrl(link)){ msg('링크는 https:// 로 시작해야 해요.', true); return; }
    var cur = editingId ? deals.filter(function(d){ return d.id === editingId; })[0] : null;
    var img = imgState.mode === 'new' ? imgState.url : (imgState.mode === 'clear' ? '' : (cur ? cur.img || '' : ''));
    var priceChanged = !cur || cur.price !== price || (cur.regular || 0) !== regular;
    var deal = {
      id: cur ? cur.id : 'd' + Date.now().toString(36),
      name: name, price: price, regular: regular, category: $('#f-cat').value.trim(),
      link: link, partner: $('#f-partner').checked, memo: $('#f-memo').value.trim(), img: img,
      pick: $('#f-pick').checked, ended: $('#f-ended').checked, sample: false,
      checked: (cur && !priceChanged) ? cur.checked : new Date().toISOString()
    };
    var others = deals.map(plain);
    var next;
    if(cur){ next = others.map(function(d){ return d.id === cur.id ? deal : d; }); }
    else { next = [deal].concat(others.filter(function(d){ return !d.sample; })); }
    commit(next);
  });

  function admRow(d){
    var r = el('div', 'ar');
    var top = el('div', '');
    top.appendChild(el('b', '', d.name)); top.appendChild(document.createElement('br'));
    top.appendChild(el('span', '', won(d.price) + (d.pct ? ' · ' + d.pct + '%' : '') + ' · ' + (d.t ? kst(d.t) + ' 확인' : '') + (d.pick ? ' · 픽' : '') + (d.ended ? ' · 종료' : '') + (d.sample ? ' · 예시' : '')));
    r.appendChild(top);
    var ab = el('div', 'ab');
    function btn(label, fn, cls){ var b = el('button', cls || '', label); b.type = 'button'; b.addEventListener('click', fn); ab.appendChild(b); return b; }
    var all = function(){ return deals.map(plain); };
    btn('수정', function(){ startEdit(d); });
    btn('가격 다시 확인했어요', function(){
      commit(all().map(function(x){ if(x.id === d.id){ x.checked = new Date().toISOString(); } return x; }));
    });
    btn(d.pick ? '픽 해제' : '픽으로', function(){
      commit(all().map(function(x){ if(x.id === d.id){ x.pick = !x.pick; } return x; }));
    });
    btn(d.ended ? '다시 진행' : '종료 처리', function(){
      commit(all().map(function(x){ if(x.id === d.id){ x.ended = !x.ended; } return x; }));
    });
    var del = btn('삭제', function(){
      if(del.getAttribute('data-armed') !== '1'){
        del.setAttribute('data-armed', '1'); del.textContent = '정말 삭제';
        setTimeout(function(){ del.setAttribute('data-armed', '0'); del.textContent = '삭제'; }, 3000);
        return;
      }
      commit(all().filter(function(x){ return x.id !== d.id; }));
    }, 'danger');
    r.appendChild(ab);
    return r;
  }
  function renderAdmin(){
    var cl = $('#catlist'); cl.innerHTML = '';
    var seen = {};
    deals.forEach(function(d){ var c = d.category; if(c && !seen[c]){ seen[c] = 1; var o = document.createElement('option'); o.value = c; cl.appendChild(o); } });
    var box = $('#admList'); box.innerHTML = '';
    if(!deals.length) box.appendChild(el('p', 'hint', '아직 등록된 딜이 없어요.'));
    deals.slice().sort(function(a, b){ return b.t - a.t; }).forEach(function(d){ box.appendChild(admRow(d)); });
    $('#clearSample').hidden = !deals.some(function(d){ return d.sample; });
  }
  $('#clearSample').addEventListener('click', function(){
    commit(deals.filter(function(d){ return !d.sample; }).map(plain));
  });
  function openAdmin(){ renderAdmin(); $('#admin').hidden = false; }
  function closeAdmin(){ $('#admin').hidden = true; try{ sessionStorage.removeItem('hd-admin'); }catch(e){} }
  $('#adminBtn').addEventListener('click', openAdmin);
  $('#admClose').addEventListener('click', closeAdmin);
  $('#admin').addEventListener('click', function(e){ if(e.target === $('#admin')) closeAdmin(); });

  async function initAdmin(){
    if(!(window.claude && claude.use)) return;
    var user = null;
    try{ user = await claude.use('user'); }catch(e){ user = null; }
    var ok = false;
    try{ ok = !!(user && (user.isOwner() || user.canEdit())); }catch(e){ ok = false; }
    if(!ok || !getT()) return;
    adminReady = true;
    $('#adminBtn').hidden = false;
    try{ if(sessionStorage.getItem('hd-admin') === '1') openAdmin(); }catch(e){}
  }

  syncView(); buildChips(); render(); resetForm();
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAdmin);
  else initAdmin();
})();
</script>
</body>
